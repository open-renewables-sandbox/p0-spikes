name: p2-s1-review

# P2 step 1 (V-05 5c). Sandbox only. The pull request is opened by the owner; the App approves the
# head at the time the pull request is opened if the branch name contains "-stale-".
on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  review:
    if: contains(github.head_ref, 'p2-s1/pr-stale-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Approve the opening head as the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p out
          gh api "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD" -f body="synthetic approval" > out/review-post.json
          cat out/review-post.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p2-s1-review-${{ github.event.pull_request.number }}
          path: out/
