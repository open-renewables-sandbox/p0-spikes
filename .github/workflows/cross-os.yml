name: cross-os
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to archive (V-12)
        default: v0.0.1-p0
permissions: {}
jobs:
  matrix:
    name: ${{ matrix.os }} py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        py: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: V-12 build archive from the tag
        run: |
          git fetch --tags --force
          mkdir out
          uv run --no-project --python "${{ matrix.py }}" python spikes/V-12-reproducible-archive/build_archive.py \
            "${{ inputs.tag }}" fixtures/bundle/knowledge/ fixtures/archive-extra/ --json out/r12.json
      - name: V-13 fresh clone, poe tasks, hooks
        env:
          UV_PYTHON: ${{ matrix.py }}
        run: bash spikes/V-13-run.sh spikes/V-13-poe-tasks "$PWD/out/r13.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.os }}-py${{ matrix.py }}
          path: out/
  compare:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
      - name: Compare
        run: python3 spikes/compare_results.py results | tee -a "$GITHUB_STEP_SUMMARY"
